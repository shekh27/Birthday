<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Happy Birthday Damini 🎂</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  background:linear-gradient(135deg,#ff9a9e,#fad0c4);

  color:white;
  text-align:center;
}

.container{
  width:90%;
  max-width:900px;
}

h1{
  font-size:5rem;
  margin-bottom:40px;
}

.question{
  font-size:2.5rem;
  margin-bottom:50px;
  font-weight:bold;
}

.buttons{
  position:relative;
}

button{
  border:none;
  cursor:pointer;
  border-radius:18px;
  font-weight:bold;
  transition:0.2s;
}

/* YES BUTTON */
#yesBtn{
  background:#00e676;
  color:white;

  padding:25px 70px;
  font-size:2rem;

  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

#yesBtn:hover{
  transform:scale(1.05);
}

/* NO BUTTON */
#noBtn{

  position:fixed;

  background:#ff5252;
  color:white;

  padding:10px 18px;
  font-size:1rem;

  left:62vw;
  top:68vh;

  z-index:999;

  transition:
    left 0.15s ease,
    top 0.15s ease,
    transform 0.2s;
}

/* GIFT SECTION */
#giftSection{
  display:none;
}

.gift-title{
  font-size:3rem;
  margin-bottom:40px;
}

.gift-grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

  gap:25px;
}

.gift-card{

  background:rgba(255,255,255,0.18);

  padding:30px;

  border-radius:25px;

  cursor:pointer;

  transition:0.3s;

  backdrop-filter:blur(8px);
}

.gift-card:hover{
  transform:translateY(-10px) scale(1.04);
}

.emoji{
  font-size:4rem;
  margin-bottom:15px;
}

/* FINAL MESSAGE */
#finalMessage{
  display:none;
  font-size:3rem;
  line-height:1.5;
}

/* CONFETTI */
.confetti{
  position:fixed;

  width:12px;
  height:12px;

  top:-20px;

  animation:fall linear forwards;
}

@keyframes fall{

  to{
    transform:
      translateY(110vh)
      rotate(720deg);

    opacity:0;
  }

}

</style>
</head>

<body>

<!-- MAIN SECTION -->
<div class="container" id="mainSection">

  <h1>
    🎂 Happy Birthday Damini 🎂
  </h1>
   <div class="photo-gallery">

  <img src="D1.jpeg" alt="">
  <img src="D2.jpeg" alt="">
  <img src="D3.jpeg" alt="">
  <img src="D4.jpeg" alt="">

</div>
  <div class="question" id="questionText">
    Party degi? 😌
  </div>

  <div class="buttons">

    <button id="yesBtn">
      YES 😎
    </button>

    <button id="noBtn">
      No 😭
    </button>

  </div>

</div>


<!-- GIFT SECTION -->
<div class="container" id="giftSection">

  <div class="gift-title">
    Chal ab bata 😌<br>
    Gift kya legi?
  </div>

  <div class="gift-grid">

    <div class="gift-card"
      onclick="selectGift('Dimag 🧠')">

      <div class="emoji">🧠</div>
      <h2>Dimag</h2>

    </div>


    <div class="gift-card"
      onclick="selectGift('Hand Fan 🪭')">

      <div class="emoji">🪭</div>
      <h2>Hand Fan</h2>

    </div>


    <div class="gift-card"
      onclick="selectGift('Pani 🚰')">

      <div class="emoji">🚰</div>
      <h2>Pani</h2>

    </div>


    <div class="gift-card"
      onclick="selectGift('Intern PPO 💼')">

      <div class="emoji">💼</div>
      <h2>Intern PPO</h2>

    </div>

  </div>

</div>


<!-- FINAL MESSAGE -->
<div class="container" id="finalMessage">

</div>



<script>

const yesBtn =
  document.getElementById("yesBtn");

const noBtn =
  document.getElementById("noBtn");

const questionText =
  document.getElementById("questionText");

let stage = 1;



/* YES BUTTON */

yesBtn.addEventListener("click", () => {

  launchParty();

});



/* NO BUTTON */

noBtn.addEventListener("click", () => {

  // sirf first page pe clickable
  if(stage === 1){

    stage = 2;

    questionText.innerHTML =
      "Areee 😭<br><br>Pakka Party nahi degi?";

    // YES BIG
    yesBtn.style.padding =
      "35px 100px";

    yesBtn.style.fontSize =
      "3rem";

    // NO SMALL
    noBtn.style.padding =
      "6px 12px";

    noBtn.style.fontSize =
      "0.7rem";

    // button reset
    noBtn.style.left = "62vw";
    noBtn.style.top = "68vh";

  }

});



/* FLOATING NO BUTTON */

document.addEventListener("mousemove", (e) => {

  // sirf second stage
  if(stage !== 2) return;

  const rect =
    noBtn.getBoundingClientRect();

  const buttonX =
    rect.left + rect.width / 2;

  const buttonY =
    rect.top + rect.height / 2;

  const mouseX = e.clientX;
  const mouseY = e.clientY;

  const distance =
    Math.sqrt(
      (mouseX - buttonX) ** 2 +
      (mouseY - buttonY) ** 2
    );

  // mouse paas aaya
  if(distance < 120){

    // random movement
    let moveX =
      (Math.random() - 0.5) * 250;

    let moveY =
      (Math.random() - 0.5) * 200;

    let newLeft =
      rect.left + moveX;

    let newTop =
      rect.top + moveY;

    // boundaries
    const margin = 20;

    if(newLeft < margin){
      newLeft = margin;
    }

    if(
      newLeft + rect.width >
      window.innerWidth - margin
    ){
      newLeft =
        window.innerWidth -
        rect.width -
        margin;
    }

    if(newTop < margin){
      newTop = margin;
    }

    if(
      newTop + rect.height >
      window.innerHeight - margin
    ){
      newTop =
        window.innerHeight -
        rect.height -
        margin;
    }

    noBtn.style.left =
      `${newLeft}px`;

    noBtn.style.top =
      `${newTop}px`;

  }

});



/* PARTY FUNCTION */

function launchParty(){

  // confetti
  for(let i=0; i<180; i++){

    const confetti =
      document.createElement("div");

    confetti.classList.add("confetti");

    confetti.style.left =
      Math.random() * 100 + "vw";

    confetti.style.background =
      `hsl(${Math.random()*360},
      100%,60%)`;

    confetti.style.animationDuration =
      (Math.random()*3 + 2) + "s";

    document.body.appendChild(confetti);

    setTimeout(() => {

      confetti.remove();

    },5000);

  }

  setTimeout(() => {

    alert("🎉 Yayyyyy! Party Confirmed 😂");

  },300);


  setTimeout(() => {

    document.getElementById(
      "mainSection"
    ).style.display = "none";

    document.getElementById(
      "giftSection"
    ).style.display = "block";

  },1000);

}



/* GIFT SELECT */

function selectGift(gift){

  document.getElementById(
    "giftSection"
  ).style.display = "none";

  document.getElementById(
    "finalMessage"
  ).style.display = "block";

  document.getElementById(
    "finalMessage"
  ).innerHTML =

  `😂 ${gift} hi milega! <br><br>
   Happy Birthday Damini ❤️<br><br>
   Ab party pending hai 😎`;

}

</script>

</body>
</html>
